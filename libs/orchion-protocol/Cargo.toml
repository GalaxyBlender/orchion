[package]
name = "orchion-protocol"
version = "0.3.0"
edition = "2024"
rust-version = "1.95"
description = "Wire protocol types shared by Orchion Server and SDKs"
license = "MIT"
repository = "https://github.com/xuan/orchion"

[features]
default = []
schema = ["dep:utoipa"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
utoipa = { version = "5", optional = true }

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"
