[package]
name = "orchion-qwen3"
version = "0.3.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false

[features]
default = []
asr = ["dep:qwen3-asr"]
tts = ["dep:qwen3-tts", "dep:whatlang"]
cpu = ["qwen3-tts?/cpu"]
metal = ["candle-core/metal", "qwen3-asr?/metal", "qwen3-tts?/metal"]
cuda = ["candle-core/cuda", "qwen3-asr?/cuda", "qwen3-tts?/cuda"]
flash-attn = []

[dependencies]
anyhow = "1"
# Keep this in sync with Candle in both vendored Qwen3 crates.
candle-core = "0.11.1"
orchion-core = { version = "0.3.0", path = "../orchion-core" }
qwen3-asr = { path = "../../vendor/qwen3-asr", optional = true, default-features = false }
qwen3-tts = { path = "../../vendor/qwen3-tts", optional = true, default-features = false }
tokio = { version = "1", features = ["rt"] }
tracing = "0.1"
whatlang = { version = "0.18", optional = true }

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"
