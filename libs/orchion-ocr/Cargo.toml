[package]
name = "orchion-ocr"
version = "0.3.0"
edition = "2024"
rust-version = "1.95"
description = "OCR runtime adapter for Orchion"
license = "MIT"
repository = "https://github.com/xuan/orchion"

[features]
default = []
ocr = ["dep:oar-ocr", "dep:ort", "oar-ocr/download-binaries"]
ocr-vl = ["dep:candle-core", "dep:htmd", "dep:oar-ocr", "dep:oar-ocr-vl", "dep:ort", "oar-ocr/download-binaries", "oar-ocr-vl/download-binaries"]
cpu = []
metal = ["oar-ocr?/webgpu", "oar-ocr-vl?/metal", "ort?/webgpu"]
cuda = ["oar-ocr?/cuda", "oar-ocr-vl?/cuda", "ort?/cuda"]

[dependencies]
anyhow = "1"
candle-core = { version = "0.11.0", default-features = false, optional = true }
htmd = { version = "0.5.5", optional = true }
image = "0.25.10"
oar-ocr = { version = "0.8.1", default-features = false, optional = true }
oar-ocr-vl = { version = "0.8.1", default-features = false, optional = true }
orchion-core = { version = "0.3.0", path = "../orchion-core" }
ort = { version = "=2.0.0-rc.12", features = ["std"], default-features = false, optional = true }
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync"] }
tracing = "0.1"

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"
